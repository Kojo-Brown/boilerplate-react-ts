# ─────────────────────────────────────────────────────────────────────────────
# Cache-Control as a map rather than as an `add_header` inside the asset
# location, because of the one nginx rule that makes security headers
# disappear: `add_header` directives are inherited from the enclosing level
# *only if no `add_header` appears at the current level*. Until this file used
# a map, `location ~* \.(js|css|…)$` declared a Cache-Control header and
# thereby dropped every security header the server block sets — so the files
# that are 99% of this application's bytes were served with no
# `X-Content-Type-Options`, no `Referrer-Policy` and (once there was one) no
# Content-Security-Policy.
#
# A map keeps the decision per-URI and the `add_header` list in exactly one
# place, where the inheritance rule has nothing to drop. Legal here because
# `/etc/nginx/conf.d/*.conf` is included inside `http { }`.
# ─────────────────────────────────────────────────────────────────────────────
map $uri $cache_control {
  # Content-hashed: the name changes when the bytes do, so this is safe to
  # keep for a year.
  ~*\.(js|css|png|jpe?g|gif|svg|ico|woff2?|ttf|eot|webp|avif)$  "public, max-age=31536000, immutable";
  # Everything else is `index.html` or the service worker. The shell carries a
  # per-request nonce and may never be stored by any cache — a nonce two
  # visitors share is not a nonce — and `/sw.js` must be re-checked on every
  # visit or an update can never land.
  default                                                       "no-store";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # ───────────────────────────────────────────────────────────────────────────
  # Content-Security-Policy
  #
  # The policy itself is generated by the build (`tooling/csp/vitePlugin.ts`)
  # and included below, because `connect-src` has to name the same origins
  # `VITE_API_URL` and friends were inlined into the bundle as — and only the
  # build knows what those were. A hand-written policy here would be a second
  # source of truth whose staleness shows up as every API call failing in
  # production. See `docs/csp.md`.
  #
  # What is left for nginx is the half a build cannot do: minting a value that
  # is different on every response. `$request_id` is 16 random bytes in hex,
  # which is exactly the 128 bits CSP Level 3 asks of a nonce, and it is
  # already computed for every request.
  # ───────────────────────────────────────────────────────────────────────────
  set $csp_nonce $request_id;
  include /etc/nginx/csp-policy.conf;

  # The substitution. `index.html` ships with `nonce="__CSP_NONCE__"` on every
  # tag Vite generated, and this is what turns the placeholder into this
  # response's nonce — the same value the header above carries, which is the
  # whole contract. `sub_filter` runs ahead of the gzip filter, so `gzip on`
  # below does not hide the body from it.
  #
  # `sub_filter_once off` because there are eight occurrences and the default
  # replaces one. A build whose placeholder went unreplaced fails closed:
  # `__CSP_NONCE__` matches no nonce, so nothing executes, which is the right
  # direction for a mistake of this kind to fall.
  #
  # No `sub_filter_types`: `text/html` is always in the list and cannot be
  # removed, so naming it is a duplicate-MIME-type warning at startup and
  # naming anything else would put the filter over responses that have no
  # placeholder in them.
  sub_filter_once off;
  sub_filter '__CSP_NONCE__' $csp_nonce;

  # Write temp files to locations writable by the nginx user
  client_body_temp_path /var/cache/nginx/client_temp;
  proxy_temp_path       /var/cache/nginx/proxy_temp;
  fastcgi_temp_path     /var/cache/nginx/fastcgi_temp;
  uwsgi_temp_path       /var/cache/nginx/uwsgi_temp;
  scgi_temp_path        /var/cache/nginx/scgi_temp;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/xml+rss
    application/atom+xml
    image/svg+xml;

  # Dotfiles and dot-directories are build metadata, not payload: `dist/.vite/`
  # holds the manifest the bundle-budget gate reads and `dist/.csp/` holds the
  # policy this server includes. Both were publicly fetchable before this
  # block existed. First among the regex locations, because the first matching
  # regex wins — and ahead of the static-asset rule, which would otherwise
  # serve `/.csp/policy.conf` quite happily.
  #
  # If this application ever needs `/.well-known/`, that needs its own
  # `location ^~ /.well-known/` above this one.
  location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
  }

  # Long-lived cache for content-hashed static assets. The Cache-Control value
  # comes from the map at the top of this file; see the comment there for why
  # it is not an `add_header` in this block.
  location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot|webp|avif)$ {
    access_log off;
  }

  # Liveness probe used by the HEALTHCHECK and container orchestrators.
  # `default_type` rather than `add_header Content-Type`, which would both be
  # the wrong directive for the job and drop every inherited header.
  location /health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # SPA catch-all: serve index.html for any unmatched path
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Response headers. Every one of them lives here, at server level, so the
  # inheritance rule described at the top of this file has nothing to take
  # away from any location.
  add_header Content-Security-Policy $csp_policy always;
  add_header Cache-Control $cache_control always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
